<!DOCTYPE html>
<!-- ai_news_note 插件独立配置页。独立文件，不改上游 dashboard.html，合并零冲突。 -->
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI 日报 · SiverWXbot</title>
  <style>
    :root { --bg:#f5f6f8; --card:#fff; --line:#e5e7eb; --text:#1f2328; --muted:#6b7280; --brand:#d97706; --brand-d:#b45309; }
    * { box-sizing:border-box; }
    body { margin:0; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif; background:var(--bg); color:var(--text); line-height:1.6; }
    .wrap { max-width:760px; margin:0 auto; padding:28px 20px 60px; }
    .top { display:flex; align-items:center; justify-content:space-between; margin-bottom:8px; }
    h1 { font-size:20px; margin:0; }
    .back { color:var(--brand); text-decoration:none; font-size:14px; }
    .sub { color:var(--muted); font-size:13px; margin:0 0 20px; }
    .card { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:18px 20px; margin-bottom:16px; }
    .card h2 { font-size:15px; margin:0 0 4px; }
    .card .hint { color:var(--muted); font-size:12.5px; margin:0 0 14px; }
    .row { display:flex; align-items:center; gap:10px; padding:9px 10px; border:1px solid var(--line); border-radius:9px; margin-bottom:8px; background:#fafafa; }
    .row label { flex:1; cursor:pointer; word-break:break-all; }
    .switch { position:relative; width:44px; height:24px; flex:none; }
    .switch input { opacity:0; width:0; height:0; }
    .slider { position:absolute; inset:0; background:#cbd5e1; border-radius:24px; transition:.2s; cursor:pointer; }
    .slider:before { content:""; position:absolute; width:18px; height:18px; left:3px; top:3px; background:#fff; border-radius:50%; transition:.2s; }
    .switch input:checked + .slider { background:var(--brand); }
    .switch input:checked + .slider:before { transform:translateX(20px); }
    input[type=text] { width:100%; border:1px solid var(--line); border-radius:9px; padding:9px 11px; font-size:14px; font-family:inherit; color:var(--text); }
    .grid { display:grid; grid-template-columns:120px 1fr; gap:10px 12px; align-items:center; }
    .grid > span { color:var(--muted); font-size:13px; }
    .grid > b { font-size:14px; font-weight:600; word-break:break-all; }
    .bar { position:sticky; bottom:0; background:linear-gradient(transparent,var(--bg) 30%); padding:16px 0 4px; display:flex; gap:12px; align-items:center; }
    button { background:var(--brand); color:#fff; border:0; border-radius:9px; padding:11px 22px; font-size:15px; cursor:pointer; }
    button:hover { background:var(--brand-d); }
    button.ghost { background:#eef2f5; color:var(--text); }
    #msg, #sendmsg { font-size:13.5px; margin-left:6px; }
    .ok { color:var(--brand-d); } .err { color:#dc2626; }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="top">
      <h1>🐶 AI 日报</h1>
      <a class="back" href="/dashboard">← 返回面板</a>
    </div>
    <p class="sub">每天定时把 AI 日报精选发成微信收藏笔记，转发到目标群。每次发送结果（成功/失败）都会推送到飞书。</p>

    <div id="ready-banner" style="padding:14px 18px;border-radius:12px;margin-bottom:16px;font-size:15px;font-weight:600;text-align:center;background:#eef2f5;color:#555;">日报就绪状态检查中…</div>

    <div class="card">
      <h2>运行状态</h2>
      <p class="hint">下次自动发送时间、上次结果、数据文件情况一目了然。</p>
      <div class="grid">
        <span>总开关</span><b id="st-enabled">—</b>
        <span>发送时间</span><b id="st-time">—</b>
        <span>发送目标</span><b id="st-target">—</b>
        <span>今日状态</span><b id="st-today">—</b>
        <span>上次发送</span><b id="st-last">—</b>
        <span>日报数据</span><b id="st-data">—</b>
      </div>
    </div>

    <div class="card">
      <h2>手动发送</h2>
      <p class="hint">立刻发一次（会真发到上面的「发送目标」）。约 30 秒完成，结果推送到飞书，也可点「刷新状态」查看。</p>
      <button id="send">立即发送一次</button>
      <span id="sendmsg"></span>
    </div>

    <div class="card">
      <h2>配置</h2>
      <div class="row"><label for="cfg-enabled">总开关（关闭后不再定时发送）</label>
        <span class="switch"><input type="checkbox" id="cfg-enabled"><span class="slider"></span></span></div>
      <div class="grid" style="margin-top:12px;">
        <span>发送时间</span><input type="text" id="cfg-time" placeholder="09:10">
        <span>目标群/联系人</span><input type="text" id="cfg-target" placeholder="🏜️AI 及其代理人联邦">
      </div>
      <p class="hint" style="margin-top:12px;">保存后：<b>目标 / 开关</b>即时生效；<b>发送时间</b>改动需在主面板「停止机器人 → 启动机器人」后生效。</p>
    </div>

    <div class="bar">
      <button id="save">保存配置</button>
      <button class="ghost" onclick="loadStatus()">刷新状态</button>
      <span id="msg"></span>
    </div>
  </div>

  <script>
    function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

    async function loadStatus() {
      const msg = document.getElementById('msg'); msg.textContent = '';
      try {
        const r = await fetch('/ai_news/status');
        const d = await r.json();
        if (d.status !== 'success') { msg.innerHTML = '<span class="err">加载失败：'+esc(d.message)+'</span>'; return; }
        const c = d.data;
        document.getElementById('st-enabled').textContent = c.enabled ? '✅ 开启' : '⛔ 关闭';
        document.getElementById('st-time').textContent = '每天 ' + esc(c.send_time);
        document.getElementById('st-target').textContent = esc(c.target);
        document.getElementById('st-today').textContent = c.sent_today ? '✅ 今天已发送' : '⏳ 今天尚未发送';
        document.getElementById('st-last').textContent = c.last_sent || '（无记录）';
        document.getElementById('st-data').textContent = c.data_exists
          ? ('✅ ' + esc(c.data_date) + '（' + (c.data_count==null?'?':c.data_count) + ' 条）')
          : '❌ 数据文件不存在';
        // 日报就绪指示灯：数据日期==今天=绿；否则=红（发送会被校验拦截）
        const rb = document.getElementById('ready-banner');
        if (!c.data_exists) {
          rb.style.background = '#fee2e2'; rb.style.color = '#991b1b';
          rb.textContent = '⚠️ 日报数据文件不存在，无法发送';
        } else if (c.data_is_today) {
          rb.style.background = '#dcfce7'; rb.style.color = '#166534';
          rb.textContent = '✅ 今日日报已就绪 · ' + esc(c.data_date) + '（' + (c.data_count==null?'?':c.data_count) + ' 条），可以发送';
        } else {
          rb.style.background = '#fee2e2'; rb.style.color = '#991b1b';
          rb.textContent = '⚠️ 今日（' + esc(c.today) + '）日报未就绪 — 当前是 ' + esc(c.data_date||'无') + ' 的旧数据，发送会被自动拦截';
        }
        document.getElementById('cfg-enabled').checked = !!c.enabled;
        document.getElementById('cfg-time').value = c.send_time || '';
        document.getElementById('cfg-target').value = c.target || '';
      } catch (e) { msg.innerHTML = '<span class="err">加载失败：'+esc(e.message)+'</span>'; }
    }

    document.getElementById('send').onclick = async () => {
      const m = document.getElementById('sendmsg');
      m.textContent = '发送已触发，约 30 秒完成，结果看飞书…';
      try {
        const r = await fetch('/ai_news/send_now', {method:'POST'});
        const d = await r.json();
        m.innerHTML = '<span class="ok">✓ ' + esc(d.message) + '</span>';
        setTimeout(loadStatus, 35000);
      } catch (e) { m.innerHTML = '<span class="err">✗ ' + esc(e.message) + '</span>'; }
    };

    document.getElementById('save').onclick = async () => {
      const payload = {
        enabled: document.getElementById('cfg-enabled').checked,
        send_time: document.getElementById('cfg-time').value.trim(),
        target: document.getElementById('cfg-target').value.trim()
      };
      const m = document.getElementById('msg'); m.textContent = '保存中…';
      try {
        const r = await fetch('/ai_news/save', {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(payload)});
        const d = await r.json();
        m.innerHTML = d.status==='success' ? '<span class="ok">✓ '+esc(d.message)+'</span>' : '<span class="err">✗ '+esc(d.message||'保存失败')+'</span>';
        if (d.status==='success') loadStatus();
      } catch (e) { m.innerHTML = '<span class="err">✗ '+esc(e.message)+'</span>'; }
    };

    loadStatus();
  </script>
</body>
</html>
